<!doctype html>
<html>
  <body>
    <h1>My First Web Page</h1>
    <p>My First Paragraph</p>

    <p id="demo"></p>

    <script>
      document.getElementById("demo").innerHTML = "<h2>Hello World</h2>";
      // this will replace the content of the <p> element with id="demo" with the new HTML code, which is a heading level 2 with the text "Hello World".
    </script>
  </body>
</html>
