<!doctype html>
<html>
  <body>
    <h1>My First Web Page</h1>
    <p>My First Paragraph</p>

    <p id="demo"></p>

    <script>
      document.getElementById("demo").innerText = "Hello World";
      // this will replace the content of the <p> element with id="demo" with the new text "Hello World". The innerText property will treat the string as plain text, so any HTML tags will be displayed as text rather than being rendered as HTML. this means that if you were to set innerText to "<h2>Hello World</h2>", it would display the string "<h2>Hello World</h2>" as plain text, rather than rendering it as a heading level 2.
    </script>
  </body>
</html>
